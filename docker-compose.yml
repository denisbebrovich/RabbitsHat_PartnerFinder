version: '3.8'

services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_DB: partner_finder
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/init_sql:/docker-entrypoint-initdb.d

volumes:
  postgres_data:
