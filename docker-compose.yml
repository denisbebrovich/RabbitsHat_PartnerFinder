services:
  postgres:
    image: postgres:13
    container_name: postgres
    environment:
      POSTGRES_DB: partner_finder
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    networks:
      - net
    volumes:
      - postgres_data:/var/lib/postgresql/data

  fastapi:
    container_name: fastapi
    environment:
      POSTGRES_URL: postgresql://admin:password@postgres:5432
    build:
      context: ./back/
      dockerfile: ./fastapi/Dockerfile
    ports:
      - "8000:8000"
    networks:
      - net
    depends_on:
      - postgres

volumes:
  postgres_data:

networks:
  net:
