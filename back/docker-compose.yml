services:
  postgres:
    image: postgres:13
    container_name: postgres
    environment:
      POSTGRES_DB: partner_finder
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    networks:
      - net
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

networks:
  net:
